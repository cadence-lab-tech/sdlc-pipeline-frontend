# Базовые образы Dockerfile (CLAB-203, решение 0051). Все FROM
# закреплены по digest; раз в неделю Dependabot открывает PR, если upstream
# переопубликовал тот же тег (node:24-alpine, golang:1.26-alpine с новым
# патчем Go, caddy:2-alpine с новыми пакетами Alpine). PR проходит ci.yml со
# сборкой образа, человек сливает его напрямую после зелёного CI.
#
# Caddy образа собирается из исходников (CLAB-234, решение 0056), его версия
# и модули — caddy/go.mod: их обновляет запись gomod ниже, только для этого
# каталога. Сам Caddy — патчи и minor линии v2; golang.org/x/* — и косвенные,
# одним PR: в них приходят исправления net/http2, crypto и TLS, которых
# релиз Caddy ждать не должен. Остальные модули Caddy едут с его релизом.
# Исключение — github.com/klauspost/compress: поднят вручную до v1.20.2 ради
# GO-2026-6865 (CLAB-475), в allow-список не входит и дальше едет с релизом
# Caddy.
#
# Смена линии — не автоматом: Node 26, Go 1.27, Caddy 3 — решение человека
# отдельной задачей, поэтому minor и major у node, golang и caddy (образа)
# и major у модуля Caddy игнорируются.
#
# Ещё — actions workflow'ов (CLAB-142, ниже).
#
# Политика целиком — решение 0051 («Уточнено CLAB-374»). Version updates
# (PR по расписанию) ведутся только для docker /, gomod /caddy и
# github-actions /. npm (package.json интерфейса) — без version updates:
# его покрывают алерты и security updates Dependabot (включены в настройках
# репозитория), они сами открывают PR с исправлением. Security update gomod
# /caddy берёт модули только из allow ниже: по остальным (otel и прочие
# модули Caddy) PR не откроется (all_versions_ignored), и исправление
# поднимается задачей вручную. Алерт, у которого исправления нет, разбирается
# по достижимости: попадает ли код в образ; если сканер клиента его видит —
# утверждение в .github/release/openvex.json и строка «Known scanner
# findings» в docs/admin.md пакета self-hosted, затем dismiss
# tolerable_risk с комментарием; если кода нет в образе (сборочная
# зависимость) — просто dismiss с причиной.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "Dependabot"
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: caddy
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: gomod
    directory: /caddy
    schedule:
      interval: weekly
    commit-message:
      prefix: "Dependabot"
    allow:
      - dependency-name: github.com/caddyserver/caddy/v2
      - dependency-name: golang.org/x/*
        dependency-type: all
    groups:
      golang-x:
        patterns:
          - golang.org/x/*
    ignore:
      - dependency-name: github.com/caddyserver/caddy/v2
        update-types:
          - version-update:semver-major
      # golang.org/x/crypto/x509roots/fallback — вложенный модуль без тегов
      # (только псевдоверсии): Dependabot принимает его за часть
      # golang.org/x/crypto и просит несуществующую v0.59.0, задание группы
      # падает с dependency_file_not_resolvable (CLAB-374). Новую
      # псевдоверсию приносит релиз Caddy, который его требует.
      - dependency-name: golang.org/x/crypto/x509roots/fallback

  # Actions workflow'ов закреплены по SHA (CLAB-142): тег можно
  # переписать, SHA — нет, и сам SHA без обновления протух бы. Dependabot
  # двигает SHA вместе с версией в комментарии; все actions — одним PR в
  # неделю, он проходит ci.yml, человек сливает после зелёного CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "Dependabot"
    groups:
      github-actions:
        patterns:
          - "*"
