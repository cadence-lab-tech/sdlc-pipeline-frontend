# Выпуск версии интерфейса по тегу v*: образ
# ghcr.io/<владелец>/sdlc-pipeline-frontend:vX.Y.Z.
#
# Версия выходит одним тегом в двух репозиториях: здесь — интерфейс, в
# sdlc-pipeline-backend — сервис и CLI (его release.yml). Тот выпуск, что
# опубликует свой образ вторым, оповещает репозиторий поставки
# cadence-lab-tech/self-hosted. Выкладку нашего инстанса тег не запускает:
# она идёт из deploy.yml по push в main и по SHA.
#
# Цепочка поставки (CLAB-130, решение 0046): образ подписан cosign без
# ключей — сертификатом на OIDC-токен этого прогона, identity
# .../.github/workflows/release.yml@refs/tags/vX.Y.Z, — к нему приложены
# SBOM (SPDX, включая npm-пакеты этапа сборки), provenance (SLSA v1,
# mode=max) и VEX (openvex.json, CLAB-234); подписан digest индекса, а с ним
# и манифесты аттестаций в индексе. Команды проверки для клиента —
# docs/admin.md в self-hosted, «Verifying a release».
#
# После подписи и VEX govulncheck в бинарном режиме проверяет /usr/bin/caddy
# опубликованного образа по тому же openvex.json (CLAB-304): находка вне VEX —
# предупреждение в сводке прогона, выпуск она не роняет.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # OIDC-токен прогона — для подписи образа без ключей.
      id-token: write
    env:
      # Секреты в условии шага недоступны, поэтому флаг считается здесь.
      HAS_SELF_HOSTED_TOKEN: ${{ secrets.SELF_HOSTED_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # Образ версии уходит наружу и без лицензии выходить не должен.
      # Dockerfile отсутствие файла терпит — ради сборок по SHA.
      - name: лицензия на месте
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error file=LICENSE::в корне репозитория нет LICENSE — образ ${GITHUB_REF_NAME} без лицензии не публикуется"
            exit 1
          fi

      - id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/$owner" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Тот же Dockerfile, что у deploy.yml. Метка source привязывает пакет
      # к репозиторию — видимость в GHCR тогда переключается на пакете.
      #
      # Образ выходит индексом под две платформы: self-hosted ставят и на
      # amd64-серверы, и на arm64 (Graviton, Ampere, Apple Silicon). Статика
      # собирается один раз на раннере (Dockerfile, $BUILDPLATFORM), QEMU
      # намеренно не подключён: RUN под целевой платформой должен ронять
      # сборку, а не тихо уходить в эмуляцию.
      #
      # SBOM (SPDX, сканер BuildKit; этап сборки с npm-пакетами — флагом
      # BUILDKIT_SBOM_SCAN_STAGE в Dockerfile) и provenance (SLSA v1) —
      # манифесты аттестаций внутри индекса, по одному на платформу. Режим и
      # версия provenance заданы явно: по умолчанию action даёт max только
      # публичному репозиторию, а версию предиката выбирает BuildKit.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max,version=v1
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.registry }}/sdlc-pipeline-frontend:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      # Подписывается digest индекса, не тег: тег в реестре переписываем,
      # digest — нет. Индекс перечисляет манифесты платформ и аттестаций,
      # поэтому подпись покрывает и SBOM с provenance.
      - name: подписать образ
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}/sdlc-pipeline-frontend@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      # Известные ложные находки сканеров по образу (GO-2026-5932 у Caddy,
      # zlib базы Alpine) — подписанным OpenVEX рядом с образом, как у
      # backend. Исходник утверждений правится PR в
      # .github/release/openvex.json, не здесь. Невалидный файл роняет шаг —
      # и self-hosted о выпуске не оповещается.
      - name: VEX к образу
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}/sdlc-pipeline-frontend@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type openvex --predicate .github/release/openvex.json "$IMAGE"

      # То, что увидит клиент со сканером по модулям: govulncheck в
      # бинарном режиме по /usr/bin/caddy из опубликованного образа (Caddy
      # собран из исходников, CLAB-234, и находки его модулей Go иначе ничем
      # не ловятся). Находка вне VEX — предупреждение с ID в сводке прогона,
      # релиз не падает: образ уже опубликован и подписан, а разбор находки —
      # PR (подъём зависимости в caddy/go.mod или запись в openvex.json).
      - uses: actions/setup-go@v7
        with:
          go-version-file: caddy/go.mod
          cache: false
      - name: govulncheck по бинарю Caddy образа
        continue-on-error: true
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}/sdlc-pipeline-frontend@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p image-bin
          id=$(docker create --platform linux/amd64 "$IMAGE")
          docker cp "$id:/usr/bin/caddy" image-bin/caddy
          docker rm "$id" >/dev/null
          .github/release/govulncheck-binaries.sh .github/release/openvex.json image-bin/caddy

      # Событие cadence-release шлёт тот выпуск, который опубликовал и
      # подписал свой образ вторым (см. скрипт): релиз-PR self-hosted пишет
      # digest обоих образов в compose и проверяет их подписи. Без секрета
      # шаг не падает, а печатает команду для отправки руками.
      - name: оповестить self-hosted
        env:
          VERSION: ${{ github.ref_name }}
          REGISTRY: ${{ steps.meta.outputs.registry }}
          SELF: frontend
          DIGEST: ${{ steps.build.outputs.digest }}
          SIGNED: "true"
          HAS_TOKEN: ${{ env.HAS_SELF_HOSTED_TOKEN }}
          GH_TOKEN: ${{ secrets.SELF_HOSTED_DISPATCH_TOKEN }}
        run: .github/release/notify-self-hosted.sh
