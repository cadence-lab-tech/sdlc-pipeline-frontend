# Проверка кода на каждом pull request и на каждом push в main.
#
# Без секретов: прогон одинаков для ветки clab/* и для PR из форка, права
# токена — только чтение. Один job с закреплённым именем `frontend` — это
# строка обязательной проверки в защите main (CLAB-142); шаги внутри можно
# менять, имя — нет. Выкладка (deploy.yml) ждёт зелёный прогон этого
# workflow'а для того же коммита.
#
# Фильтра по путям нет намеренно: обязательная проверка должна выставляться
# на любой PR, иначе PR с одной правкой документации повиснет в «expected».
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR: новый push отменяет прогон предыдущего коммита. main: нет — прогон на
# main ждёт deploy.yml, и отменённый он увидел бы как провал.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend
    # Раннер закреплён, а не ubuntu-latest: смена образа под ногами не
    # должна менять поведение проверки (CLAB-151).
    runs-on: ubuntu-24.04
    # Шаг image собирает и Caddy из исходников (CLAB-234): холодная загрузка
    # модулей и компиляция добавляют несколько минут.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Та же мажорная версия, что в Dockerfile и верстаке задачи.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Словари подписей — без браузера и без бэкенда (первый шаг e2e/run.sh);
      # остальным сценариям e2e нужен живой стек, в CI они не идут.
      - run: node e2e/labels.mjs

      # Скрипт оповещения self-hosted о релизе (release.yml) проверяется без
      # сети: docker и gh подменены заглушками.
      - run: bash .github/release/notify-self-hosted.test.sh

      # Образ собирается на каждом PR, без публикации (CLAB-203): база
      # Dockerfile закреплена по digest, и PR Dependabot с новым digest,
      # который ломает сборку, краснеет здесь, а не в deploy.yml уже на
      # main. Шаг внутри обязательной проверки `frontend`, поэтому красная
      # сборка не даёт слить PR. Одна платформа — linux/amd64 раннера,
      # обе — release.yml. caddy validate в образе ловит базу, с которой
      # конфиг статики не читается. Сборка падает и тогда, когда в граф
      # пакетов Caddy попал golang.org/x/crypto/openpgp (Dockerfile, VEX).
      #
      # Образ не root (CLAB-236) и слушает только :8080 (CLAB-248):
      # пользователь 65532 числом, финальный этап без RUN, у бинаря Caddy нет
      # file capability, адресной переменной нет — пустая или чужая
      # CADENCE_UI_ADDRESS ничего не меняет. Дым: образ отвечает на :8080 и
      # не отвечает на :80; запуск с --cap-drop ALL, no-new-privileges и
      # read-only корнем без tmpfs работает, и в логе Caddy нет ни
      # предупреждений, ни ошибок (persist_config off и хранилище TLS
      # выключены в deploy/Caddyfile).
      #
      # Правила кэша (CLAB-271): /, /index.html и маршруты SPA отдаются одним
      # index.html с Cache-Control: no-cache, файлы public/ без хэша — тоже
      # no-cache, существующий ассет — public, max-age=31536000, immutable,
      # несуществующий /assets/* — 404 без долгого кэша, а не index.html.
      # Иначе после апгрейда браузер берёт старый index.html из кэша.
      - name: image
        run: |
          docker build --platform linux/amd64 -t ci-frontend .
          docker run --rm ci-frontend caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e CADENCE_UI_ADDRESS= ci-frontend caddy validate --config /etc/caddy/Caddyfile
          user="$(docker image inspect ci-frontend -f '{{.Config.User}}')"
          [ "$user" = 65532:65532 ] || { echo "::error::the image runs as '$user', expected 65532:65532"; exit 1; }
          if awk '/^FROM /{run=0} /^RUN /{run=1} END{exit !run}' Dockerfile; then
            echo "::error::the final stage of Dockerfile has a RUN: it would need emulation under the target platform"
            exit 1
          fi
          if grep -nE 'setcap|libcap-utils' Dockerfile; then
            echo "::error::Dockerfile sets a file capability: the image listens on :8080 only and needs none"
            exit 1
          fi
          caps="$(docker run --rm ci-frontend getcap /usr/bin/caddy)"
          [ -z "$caps" ] || { echo "::error::/usr/bin/caddy has a file capability: $caps"; exit 1; }
          trap 'docker rm -f ci-ui ci-ui-env >/dev/null 2>&1 || true' EXIT
          # Жёсткий запуск: без capabilities, без повышения прав, read-only
          # корень без tmpfs. Чужая CADENCE_UI_ADDRESS не должна ничего менять.
          # Порт на хост — для проб кэша curl'ом: busybox wget на ошибке
          # заголовков ответа не печатает.
          docker run -d --name ci-ui --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1::8080 ci-frontend
          docker run -d --name ci-ui-env -e CADENCE_UI_ADDRESS=:9999 ci-frontend
          for c in ci-ui ci-ui-env; do
            for i in $(seq 1 20); do
              docker exec "$c" wget -q -O /dev/null http://127.0.0.1:8080/ && break
              sleep 1
            done
            docker exec "$c" wget -q -O - http://127.0.0.1:8080/projects/X/tasks/1 | grep -qi '<html' ||
              { echo "::error::$c does not serve the UI on :8080"; docker logs "$c"; exit 1; }
            if docker exec "$c" wget -q -T 3 -O /dev/null http://127.0.0.1:80/; then
              echo "::error::$c still answers on :80: the image must listen on :8080 only"; exit 1
            fi
          done
          uid="$(docker exec ci-ui awk '/^Uid:/{print $2}' /proc/1/status)"
          [ "$uid" = 65532 ] || { echo "::error::caddy runs as uid $uid, expected 65532"; exit 1; }
          [ "$(docker inspect -f '{{.State.Running}}' ci-ui)" = true ] || { echo "::error::the read-only container stopped"; docker logs ci-ui; exit 1; }
          noise="$(docker logs ci-ui 2>&1 | grep -E '"level":"(warn|error)"|permission denied|read-only file system' || true)"
          [ -z "$noise" ] || { echo "::error::Caddy complains on a read-only root without capabilities:"; echo "$noise"; exit 1; }
          # Правила кэша (CLAB-271): всё, что отдаётся как index.html, и файлы
          # public/ без хэша — no-cache; существующий /assets/* — долгий кэш;
          # несуществующий /assets/* — 404 без долгого кэша и без отката на
          # index.html. hdr <путь> [флаги curl] печатает статус и заголовки.
          base="http://$(docker port ci-ui 8080/tcp | awk 'NR == 1')"
          hdr() { local p="$1"; shift; curl -sS -o /dev/null -D - "$@" "$base$p" || true; }
          # awk дочитывает вход до конца: ранний exit под pipefail даёт SIGPIPE.
          field() { printf '%s\n' "$1" | awk -v f="$2" '!n && tolower($1)==f":"{sub(/^ *[^:]*: */,""); sub(/\r$/,""); print; n=1}'; }
          status() { printf '%s\n' "$1" | awk '!n && /^ *HTTP\//{print $2; n=1}'; }
          etag="$(field "$(hdr /)" etag)"
          for p in / /index.html /projects/X/tasks/1 /docs; do
            h="$(hdr "$p")"
            ct="$(field "$h" content-type)"
            [ "$(status "$h")" = 200 ] && [ "$(field "$h" cache-control)" = no-cache ] &&
              [ "${ct%%;*}" = text/html ] && [ -n "$etag" ] && [ "$(field "$h" etag)" = "$etag" ] ||
              { echo "::error::$p: expected index.html (200, text/html, ETag $etag) with Cache-Control: no-cache, got $(status "$h"), '$ct', ETag '$(field "$h" etag)', Cache-Control '$(field "$h" cache-control)'"; exit 1; }
          done
          h="$(hdr / -I)"
          [ "$(status "$h")" = 200 ] && [ "$(field "$h" cache-control)" = no-cache ] ||
            { echo "::error::HEAD /: expected 200 with Cache-Control: no-cache, got $(status "$h"), Cache-Control '$(field "$h" cache-control)'"; exit 1; }
          h="$(hdr / -H "If-None-Match: $etag")"
          [ "$(status "$h")" = 304 ] && [ "$(field "$h" cache-control)" = no-cache ] ||
            { echo "::error::GET / with If-None-Match: expected 304 with Cache-Control: no-cache, got $(status "$h"), Cache-Control '$(field "$h" cache-control)'"; exit 1; }
          for p in /favicon.svg /manifest.webmanifest; do
            h="$(hdr "$p")"
            [ "$(status "$h")" = 200 ] && [ "$(field "$h" cache-control)" = no-cache ] ||
              { echo "::error::$p: expected 200 with Cache-Control: no-cache, got $(status "$h"), Cache-Control '$(field "$h" cache-control)'"; exit 1; }
          done
          asset="$(docker exec ci-ui find /srv/assets -type f -name '*.js' | awk 'NR == 1')"
          [ -n "$asset" ] || { echo "::error::no /srv/assets/*.js in the image"; exit 1; }
          h="$(hdr "${asset#/srv}")"
          [ "$(status "$h")" = 200 ] && [ "$(field "$h" cache-control)" = "public, max-age=31536000, immutable" ] ||
            { echo "::error::${asset#/srv}: expected 200 with Cache-Control: public, max-age=31536000, immutable, got $(status "$h"), Cache-Control '$(field "$h" cache-control)'"; exit 1; }
          h="$(hdr /assets/does-not-exist-0000.js)"
          cc="$(field "$h" cache-control)"
          case "$cc" in *immutable* | *max-age*) long=yes ;; *) long= ;; esac
          [ "$(status "$h")" = 404 ] && [ -z "$long" ] ||
            { echo "::error::/assets/does-not-exist-0000.js: expected 404 without a long cache, got $(status "$h"), Cache-Control '$cc'"; exit 1; }
