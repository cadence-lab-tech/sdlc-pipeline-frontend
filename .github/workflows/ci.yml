# Проверка кода на каждом pull request и на каждом push в main.
#
# Без секретов: прогон одинаков для ветки clab/* и для PR из форка, права
# токена — только чтение. Один job с закреплённым именем `frontend` — это
# строка обязательной проверки в защите main (CLAB-142); шаги внутри можно
# менять, имя — нет. Выкладка (deploy.yml) ждёт зелёный прогон этого
# workflow'а для того же коммита.
#
# Фильтра по путям нет намеренно: обязательная проверка должна выставляться
# на любой PR, иначе PR с одной правкой документации повиснет в «expected».
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR: новый push отменяет прогон предыдущего коммита. main: нет — прогон на
# main ждёт deploy.yml, и отменённый он увидел бы как провал.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend
    # Раннер закреплён, а не ubuntu-latest: смена образа под ногами не
    # должна менять поведение проверки (CLAB-151).
    runs-on: ubuntu-24.04
    # Шаг image собирает и Caddy из исходников (CLAB-234): холодная загрузка
    # модулей и компиляция добавляют несколько минут.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Та же мажорная версия, что в Dockerfile и верстаке задачи.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Словари подписей — без браузера и без бэкенда (первый шаг e2e/run.sh);
      # остальным сценариям e2e нужен живой стек, в CI они не идут.
      - run: node e2e/labels.mjs

      # Скрипт оповещения self-hosted о релизе (release.yml) проверяется без
      # сети: docker и gh подменены заглушками.
      - run: bash .github/release/notify-self-hosted.test.sh

      # Образ собирается на каждом PR, без публикации (CLAB-203): база
      # Dockerfile закреплена по digest, и PR Dependabot с новым digest,
      # который ломает сборку, краснеет здесь, а не в deploy.yml уже на
      # main. Шаг внутри обязательной проверки `frontend`, поэтому красная
      # сборка не даёт слить PR. Одна платформа — linux/amd64 раннера,
      # обе — release.yml. caddy validate в образе ловит базу, с которой
      # конфиг статики не читается. Сборка падает и тогда, когда в граф
      # пакетов Caddy попал golang.org/x/crypto/openpgp (Dockerfile, VEX).
      #
      # Образ не root (CLAB-236): пользователь 65532 числом, финальный этап
      # без RUN, конфиг читается и с адресом по умолчанию (:80 и :8080), и
      # суженным до :8080, как его запускает чарт пакета. Дым: запущенный
      # образ отвечает на :8080 и :80 от uid 65532.
      - name: image
        run: |
          docker build --platform linux/amd64 -t ci-frontend .
          docker run --rm ci-frontend caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e CADENCE_UI_ADDRESS=:8080 ci-frontend caddy validate --config /etc/caddy/Caddyfile
          user="$(docker image inspect ci-frontend -f '{{.Config.User}}')"
          [ "$user" = 65532:65532 ] || { echo "::error::the image runs as '$user', expected 65532:65532"; exit 1; }
          if awk '/^FROM /{run=0} /^RUN /{run=1} END{exit !run}' Dockerfile; then
            echo "::error::the final stage of Dockerfile has a RUN: it would need emulation under the target platform"
            exit 1
          fi
          docker run -d --name ci-ui ci-frontend
          trap 'docker rm -f ci-ui >/dev/null' EXIT
          for i in $(seq 1 20); do
            docker exec ci-ui wget -q -O /dev/null http://127.0.0.1:8080/ && break
            sleep 1
          done
          uid="$(docker exec ci-ui awk '/^Uid:/{print $2}' /proc/1/status)"
          [ "$uid" = 65532 ] || { echo "::error::caddy runs as uid $uid, expected 65532"; exit 1; }
          for port in 8080 80; do
            docker exec ci-ui wget -q -O - "http://127.0.0.1:$port/projects/X/tasks/1" | grep -qi '<html' ||
              { echo "::error::the image does not serve the UI on :$port"; docker logs ci-ui; exit 1; }
          done
